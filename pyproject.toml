[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-agent-product-intelligence"
version = "0.1.0"
description = "Release intelligence for AI agents — connects agent behavior, release experiments, business metrics, and human feedback into SHIP/HOLD/ROLLBACK decisions"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "sqlalchemy>=2.0.35",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.13.3",
    "numpy>=2.1.2",
    "pandas>=2.2.3",
    "pyarrow>=17.0.0",
    "scipy>=1.14.1",
    "statsmodels>=0.14.4",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    "email-validator>=2.2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-order>=1.3.0",
]
llm = [
    "openai>=1.50.0",
    "python-dotenv>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["datagen", "backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: demo-scale or otherwise expensive tests, excluded from the default run (opt in with -m slow)",
]
addopts = "-m 'not slow'"
# validate_ground_truth.py intentionally keeps the exact filename the
# approved docs reference (INVESTIGATION.md, DATA_MODEL.md, ROADMAP.md)
# rather than pytest's default test_*.py convention — without this, pytest's
# bare discovery silently skips it (a real Stage 3 bug: explicit invocations
# like `pytest tests/validate_ground_truth.py` always worked, masking that
# the bare `pytest` command never collected it at all).
python_files = ["test_*.py", "validate_*.py"]
